<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magadi | Contact</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="text-light">
<div class="container-fluid p-0">
  <div class="row g-0">
    <nav class="col-md-3 col-lg-2 custom-nav d-flex flex-md-column justify-content-around justify-content-md-start p-3 p-md-4 border-end border-dark">
      <div class="text-center mb-md-5 mt-md-3" style="cursor: pointer;">
        <h2 class="text-info fw-bold d-none d-md-block user-select-none" id="easter-egg-trigger">Magadi.</h2>
        <p class="text-secondary d-none d-md-block small text-uppercase tracking-wide">Creative Director</p>
      </div>
      <ul class="nav flex-row flex-md-column w-100 justify-content-around gap-md-3">
        <li class="nav-item"><a class="nav-link text-secondary" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link text-secondary" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link text-secondary" href="projects.html">Projects</a></li>
        <li class="nav-item"><a class="nav-link active text-info fw-bold" href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <main class="col-md-9 col-lg-10 main-content min-vh-100 p-4 p-md-5">
      <div class="container mt-md-5">
        <div class="row">
          <div class="col-lg-6">
            <h1 class="display-4 fw-bold mb-4">Let's <span class="text-info">Connect</span>.</h1>
            <p class="text-secondary mb-4">
              Whether it's a project collaboration or a technical discussion regarding IP development, my inbox is open. Let's work.
            </p>
            <div class="mb-5 border-start border-info border-3 ps-3">
              <p class="mb-0 text-light">
                <span class="text-secondary small text-uppercase tracking-wide me-2">Direct</span> 
                <a href="mailto:contact.magadi@gmail.com" class="text-info text-decoration-none fw-bold">contact.magadi@gmail.com</a>
              </p>
            </div>
            <form class="bg-black p-4 rounded border border-dark">
              <div class="mb-3">
                <label for="nameInput" class="form-label text-info small text-uppercase">Name</label>
                <input type="text" class="form-control bg-transparent text-light border-secondary" id="nameInput" placeholder="John Doe">
              </div>
              <div class="mb-3">
                <label for="emailInput" class="form-label text-info small text-uppercase">Email Address</label>
                <input type="email" class="form-control bg-transparent text-light border-secondary" id="emailInput" placeholder="name@example.com">
              </div>
              <div class="mb-4">
                <label for="messageInput" class="form-label text-info small text-uppercase">Message</label>
                <textarea class="form-control bg-transparent text-light border-secondary" id="messageInput" rows="4" placeholder="Hello..."></textarea>
              </div>
              <button type="button" class="btn btn-info w-100 fw-bold">Send Message</button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="JS/main.js"></script>
</body>
</html>
